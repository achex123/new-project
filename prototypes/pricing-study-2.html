<!doctype html><html><head><meta charset="utf-8"><title>Pricing Study</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--bg:#fafaf9;--ink:#1c1917;--card:#fff;--line:#e7e5e4;--accent:#7c3aed}@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--ink:#f5f5f4;--card:#1c1917;--line:#292524}}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui;padding:32px 16px}h1{font-size:28px;margin:0 0 20px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));max-width:900px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.price{font-size:32px;font-weight:700}.card.pro{border-color:var(--accent)}</style></head><body><h1>Pricing Study</h1><div class="grid"><div class="card"><div>Starter</div><div class="price">$0</div></div><div class="card pro"><div>Pro</div><div class="price">$19</div></div><div class="card"><div>Team</div><div class="price">$49</div></div></div></body></html>
